apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-web-ingress
  namespace: web-hello

spec:
  ingressClassName: traefik

  rules:
    - host: web-hello.lab.local
      secretName: lab-tls
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-hello
                port:
                  number: 80
      secretName: lab-tls