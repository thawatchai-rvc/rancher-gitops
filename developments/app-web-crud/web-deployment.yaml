apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: web-crud
  labels:
    app: web
spec:
  # stateless — code อยู่ใน ConfigMap, ข้อมูลอยู่ที่ DB → วางได้ทุก node
  replicas: 2
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: crud
          image: python:3-alpine
          # ติดตั้ง lib ตอน pod เริ่ม (ทาง ก: ไม่ต้อง build image)
          command:
            - sh
            - -c
            - pip install --no-cache-dir flask psycopg2-binary && python /app/app.py
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: db.web-crud.svc
            - name: DB_USER
              value: crud
            - name: DB_NAME
              value: crud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crud-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # pip install ใช้เวลา ~10-30 วิ → ให้เวลาก่อนเช็ค
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: app
          configMap:
            name: crud-app
