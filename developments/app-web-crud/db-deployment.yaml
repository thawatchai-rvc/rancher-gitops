apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: web-crud
  labels:
    app: db
spec:
  # DB = stateful — 1 เท่านั้น, Recreate กัน multi-attach + กัน 2 writer
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      securityContext:
        # image รันเป็น user postgres (999) — ให้ volume เขียนได้
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: crud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crud-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: crud
            # ใช้ subpath เพื่อไม่ให้ lost+found ของ Longhorn รบกวน initdb
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "crud", "-d", "crud"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "crud", "-d", "crud"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
