apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: web-crud
  labels:
    app: adminer
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
        - name: adminer
          image: adminer:4.8.1
          ports:
            - containerPort: 8080
          env:
            # หน้า login ชี้ DB นี้ให้เลย (ไม่ต้องพิมพ์ server เอง)
            - name: ADMINER_DEFAULT_SERVER
              value: db.web-crud.svc
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
