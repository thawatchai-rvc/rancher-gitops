apiVersion: v1
kind: Service
metadata:
  name: graylog-web
  namespace: graylog
spec:
  type: NodePort
  selector:
    app: graylog
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      nodePort: 30900
---
apiVersion: v1
kind: Service
metadata:
  name: graylog-syslog
  namespace: graylog
spec:
  type: NodePort
  selector:
    app: graylog
  ports:
    - name: syslog-tcp
      protocol: TCP
      port: 1514
      targetPort: 1514
      nodePort: 31514
