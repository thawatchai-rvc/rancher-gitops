apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-web-ingress
  namespace: web-hello

spec:
  ingressClassName: traefik

  rules:
    - host: hello-web.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-web
                port:
                  number: 80