apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-todolist-ingress
  namespace: web-todolist

spec:
  ingressClassName: nginx

  rules:
    - host: todolist.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-todolist
                port:
                  number: 3456
