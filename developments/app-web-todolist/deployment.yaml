apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-todolist
  namespace: web-todolist
  labels:
    app: web-todolist
spec:
  # SQLite + RWO PVC = ต้องมี 1 replica เท่านั้น (multi-attach + เขียนทับกัน)
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web-todolist
  template:
    metadata:
      labels:
        app: web-todolist
    spec:
      securityContext:
        # image รันเป็น user 1000 — ให้ volume เขียนได้
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: vikunja
          image: vikunja/vikunja:2.8
          ports:
            - containerPort: 3456
          env:
            - name: VIKUNJA_SERVICE_PUBLICURL
              value: https://todolist.lab.local/
            - name: VIKUNJA_DATABASE_PATH
              value: /data/vikunja.db
            - name: VIKUNJA_FILES_BASEPATH
              value: /data/files
            - name: VIKUNJA_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: vikunja-secret
                  key: VIKUNJA_SERVICE_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3456
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3456
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: todolist-data
