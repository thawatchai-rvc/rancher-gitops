apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-todolist
  namespace: web-todolist
  labels:
    app: web-todolist
spec:
  # stateless — ไม่มี PVC ติด pod จึงวางได้ทุก node
  replicas: 2
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: web-todolist
  template:
    metadata:
      labels:
        app: web-todolist
    spec:
      containers:
        - name: vikunja
          image: vikunja/vikunja:2.8
          ports:
            - containerPort: 3456
          env:
            - name: VIKUNJA_SERVICE_PUBLICURL
              value: https://todolist.lab.local/
            # --- Pattern 1: DB แยก (PostgreSQL) ---
            - name: VIKUNJA_DATABASE_TYPE
              value: postgres
            - name: VIKUNJA_DATABASE_HOST
              value: db.web-todolist.svc
            - name: VIKUNJA_DATABASE_USER
              value: vikunja
            - name: VIKUNJA_DATABASE_DATABASE
              value: vikunja
            - name: VIKUNJA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vikunja-secret
                  key: POSTGRES_PASSWORD
            # --- Pattern 1: ไฟล์แนบผ่าน MinIO (S3) ---
            - name: VIKUNJA_FILES_TYPE
              value: s3
            - name: VIKUNJA_FILES_S3_ENDPOINT
              value: http://minio.minio.svc:9000
            - name: VIKUNJA_FILES_S3_BUCKET
              value: vikunja
            - name: VIKUNJA_FILES_S3_USEPATHSTYLE
              value: "true"
            - name: VIKUNJA_FILES_S3_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: vikunja-secret
                  key: VIKUNJA_FILES_S3_ACCESSKEY
            - name: VIKUNJA_FILES_S3_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: vikunja-secret
                  key: VIKUNJA_FILES_S3_SECRETKEY
            - name: VIKUNJA_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: vikunja-secret
                  key: VIKUNJA_SERVICE_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3456
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3456
            initialDelaySeconds: 15
            periodSeconds: 30
      # stateless: ไม่มี volumes — ข้อมูลอยู่ที่ PostgreSQL + MinIO
