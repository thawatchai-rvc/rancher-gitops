apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: web-todolist
  labels:
    app: pg-backup
spec:
  schedule: "0 2 * * *"          # ทุกวัน 02:00
  concurrencyPolicy: Forbid      # ห้าม job ซ้อนกัน ถ้า dump ยังไม่จบ
  successfulJobsHistoryLimit: 3  # เก็บ log งานล่าสุดไว้ดูย้อนหลัง
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2            # ลองใหม่สูงสุด 2 ครั้ง
      activeDeadlineSeconds: 600 # ค้างเกิน 10 นาที = ตัดทิ้ง
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pgdump
              image: postgres:17-alpine
              command: ["sh", "-c"]
              args:
                - |
                  set -e                          # หยุดทันทีถ้าคำสั่งไหนล้มเหลว
                  apk add --no-cache minio-client # Alpine ติดตั้ง binary ชื่อ mcli (ไม่ใช่ mc)

                  # 1) dump PostgreSQL (custom format = บีบอัด + restore เลือกได้)
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  pg_dump -h db -U vikunja -d vikunja -Fc -f /tmp/backup.dump
                  echo "DUMP_OK size=$(du -h /tmp/backup.dump | cut -f1)"

                  # 2) ต่อ MinIO แล้วอัปโหลด
                  mcli alias set local \
                    http://minio-api.minio.svc:9000 \
                    "$S3_ACCESSKEY" "$S3_SECRETKEY" --api s3v4
                  mcli mb --ignore-existing local/pgbackup
                  FILE="vikunja-$(date +%Y%m%d-%H%M%S).dump"
                  mcli cp /tmp/backup.dump "local/pgbackup/$FILE"
                  echo "UPLOAD_OK $FILE"

                  # 3) เก็บย้อนหลัง 7 วัน (rotate อัตโนมัติ)
                  mcli rm --recursive --older-than 7 local/pgbackup/
                  echo "ROTATE_OK"
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: vikunja-secret
                      key: POSTGRES_PASSWORD
                - name: S3_ACCESSKEY
                  valueFrom:
                    secretKeyRef:
                      name: vikunja-secret
                      key: VIKUNJA_FILES_S3_ACCESSKEY
                - name: S3_SECRETKEY
                  valueFrom:
                    secretKeyRef:
                      name: vikunja-secret
                      key: VIKUNJA_FILES_S3_SECRETKEY
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
