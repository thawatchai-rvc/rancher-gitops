apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-nginx-ingress
  namespace: web-nginx

spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - web-nginx.lab.local
      secretName: lab-tls

  rules:
    - host: web-nginx.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-nginx
                port:
                  number: 80
     