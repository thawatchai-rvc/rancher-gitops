apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-nginx-ingress
  namespace: web-nginx

spec:
  ingressClassName: traefik

  rules:
    - host: web-nginx.lab.local
      secretName: lab-tls
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-nginx
                port:
                  number: 80
      secretName: lab-tls